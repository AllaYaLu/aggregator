name: CI Pipeline

# Когда запускать пайплайн: при пуше в main и при создании/обновлении Pull Request в main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Проверка бэкенда (Линтер + Автотесты)
  backend-ci:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff linter
        working-directory: ./backend
        run: ruff check .

      - name: Run Pytest suite
        working-directory: ./backend
        run: pytest

  # 2. Проверка фронтенда (TypeScript + Production Build)
  frontend-ci:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build production bundle (includes TypeScript check)
        working-directory: ./frontend
        run: npm run build

  # 3. Проверка сборки Docker-образов
  docker-build-check:
    name: Docker Images Build Check
    runs-on: ubuntu-latest
    # Запускаем только если прошли проверки бэка и фронта
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Docker image
        run: docker build -t card-aggregator-backend:test ./backend

      - name: Build Frontend Docker image
        run: docker build -t card-aggregator-frontend:test ./frontend


  # 4. Continuous Deployment: автоматический деплой на боевой сервер по SSH
  deploy:
    name: Deploy to Yandex Cloud VPS
    runs-on: ubuntu-latest
    # Запускаем только после успешного прохождения всех тестов и сборки Docker
    needs: [backend-ci, frontend-ci, docker-build-check]
    # Запускаем только при слиянии/пуше в главную ветку main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/aggregator
            git pull origin main
            docker compose up -d --build
            docker image prune -f
